<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Admin Login - Quick Shop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet"/>

    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

    <style>
        :root {
            --qs-dark-navy: #131921;
            --qs-slate-blue: #232f3e;
            --qs-accent-orange: #ff9900;
            --qs-warm-amber: #febd69;
            --qs-btn-gradient-top: #f7dfa5;
            --qs-btn-gradient-bottom: #f0c14b;
            --qs-btn-border: #a88734;
            --qs-bg-gray: #eaeded;
            --qs-text-dark: #111827;
            --qs-text-muted: #565959;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--qs-bg-gray);
            color: var(--qs-text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .qs-navbar {
            background-color: var(--qs-dark-navy);
            border-bottom: 3px solid var(--qs-accent-orange);
        }

        .qs-logo-text {
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-decoration: none;
        }

        .qs-logo-badge {
            color: var(--qs-accent-orange);
            font-weight: 700;
        }

        .qs-form-card {
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 1rem;
            box-shadow: 0 12px 35px rgba(19, 25, 33, 0.08);
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--qs-slate-blue);
            margin-bottom: 0.35rem;
        }

        .qs-input-group {
            width: 100%;
        }

        .qs-input-group .form-control {
            border: 1px solid #ced4da;
            border-radius: 0.5rem;
            font-size: 0.92rem;
            padding: 0.65rem 0.85rem;
            min-width: 0;
            transition: all 0.2s ease-in-out;
        }

        .qs-input-group .form-control:focus {
            border-color: var(--qs-accent-orange);
            box-shadow: 0 0 0 3px rgba(255, 153, 0, 0.25);
        }

        .qs-input-icon {
            background-color: #f8f9fa;
            border-color: #ced4da;
            color: #565959;
            flex-shrink: 0;
        }

        .qs-input-group .form-control {
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
        }

        .qs-btn-register {
            background: linear-gradient(
                180deg,
                var(--qs-btn-gradient-top) 0%,
                var(--qs-btn-gradient-bottom) 100%
            );
            border: 1px solid var(--qs-btn-border);
            border-radius: 0.5rem;
            color: #111;
            font-weight: 700;
            font-size: 1.05rem;
            padding: 0.75rem 1.5rem;
            box-shadow: 0 2px 5px rgba(213, 217, 217, 0.5);
            transition: all 0.2s ease;
        }

        .qs-btn-register:hover {
            background: linear-gradient(180deg, #f5d68d 0%, #eeb933 100%);
            border-color: #846a29;
            color: #000;
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
        }

        .qs-btn-register:active {
            transform: translateY(0);
            background: #f0c14b;
        }

        @keyframes gentleFloat {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }

            100% {
                transform: translateY(0);
            }
        }

        @keyframes pulseRing {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 153, 0, 0.35);
            }

            70% {
                box-shadow: 0 0 0 22px rgba(255, 153, 0, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 153, 0, 0);
            }
        }

        .avatar-circle-wrapper {
            position: relative;
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            animation: gentleFloat 6s ease-in-out infinite;
        }

        .avatar-circle-frame {
            width: min(380px, 80vw);
            height: min(380px, 80vw);
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            border: 5px solid #ffffff;
            background: #ffffff;
            overflow: hidden;
            margin: 0 auto;
            box-shadow: 0 20px 45px rgba(35, 47, 62, 0.18);
            animation: pulseRing 3.5s infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-circle-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.04);
        }

        .floating-badge {
            position: absolute;
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 0.75rem;
            padding: 0.65rem 1rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.09);
            font-size: 0.8rem;
            font-weight: 600;
            color: #131921;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 2;
            white-space: nowrap;
        }

        .badge-top-left {
            top: 10px;
            left: 0;
        }

        .badge-bottom-right {
            bottom: 25px;
            right: 0;
        }

        @media (max-width: 991.98px) {
            .qs-form-card {
                max-width: 650px;
                margin: 0 auto;
            }

            .avatar-circle-wrapper {
                margin-top: 1rem;
            }
        }

        @media (max-width: 767.98px) {
            .qs-navbar {
                padding-top: 0.7rem !important;
                padding-bottom: 0.7rem !important;
            }

            .qs-logo-text {
                font-size: 1.2rem;
            }

            .qs-logo-text i {
                font-size: 1.4rem !important;
            }

            main {
                padding-top: 1.5rem !important;
                padding-bottom: 1.5rem !important;
            }

            main .container {
                padding-left: 1rem;
                padding-right: 1rem;
            }

            .row {
                --bs-gutter-y: 2rem;
            }

            .qs-form-card {
                padding: 1.25rem !important;
                border-radius: 0.85rem;
            }

            .qs-form-card h1 {
                font-size: 1.45rem;
            }

            .qs-form-card p {
                font-size: 0.82rem;
            }

            .avatar-circle-frame {
                width: min(320px, 75vw);
                height: min(320px, 75vw);
            }

            .floating-badge {
                font-size: 0.7rem;
                padding: 0.5rem 0.7rem;
            }

            .badge-top-left {
                left: 2%;
                top: 5px;
            }

            .badge-bottom-right {
                right: 2%;
                bottom: 15px;
            }
        }

        @media (max-width: 575.98px) {
            .qs-logo-text {
                font-size: 1.05rem;
            }

            .qs-logo-text i {
                font-size: 1.25rem !important;
            }

            .qs-form-card {
                padding: 1rem !important;
            }

            .qs-form-card h1 {
                font-size: 1.3rem;
            }

            .qs-input-group .form-control {
                font-size: 0.88rem;
                padding: 0.6rem 0.7rem;
            }

            .qs-input-icon {
                padding-left: 0.7rem;
                padding-right: 0.7rem;
            }

            .qs-btn-register {
                font-size: 0.95rem;
                padding: 0.7rem 1rem;
            }

            .avatar-circle-frame {
                width: min(270px, 70vw);
                height: min(270px, 70vw);
            }

            .floating-badge {
                font-size: 0.62rem;
                padding: 0.4rem 0.55rem;
                gap: 0.3rem;
            }

            .floating-badge i {
                font-size: 0.9rem !important;
            }

            .badge-top-left {
                left: 0;
                top: 0;
            }

            .badge-bottom-right {
                right: 0;
                bottom: 10px;
            }

            footer {
                padding-top: 0.7rem !important;
                padding-bottom: 0.7rem !important;
            }
        }

        @media (max-width: 380px) {
            .qs-logo-text span {
                font-size: 0.95rem;
            }

            .qs-form-card {
                padding: 0.9rem !important;
            }

            .avatar-circle-frame {
                width: 230px;
                height: 230px;
            }

            .floating-badge {
                font-size: 0.55rem;
            }

            .floating-badge i {
                display: none;
            }
        }
    </style>
</head>

<body>

<header class="qs-navbar py-3 px-3 px-md-4 shadow-sm">
    <div class="container-fluid d-flex align-items-center justify-content-between">
        <a class="qs-logo-text d-flex align-items-center gap-2" href="#">
            <i class="bi bi-cart3 fs-3 qs-logo-badge"></i>
            <span>Quick Shop <span class="qs-logo-badge">Admin</span></span>
        </a>
    </div>
</header>

<main class="flex-grow-1 py-4 py-lg-5">
    <div class="container my-auto py-4">

        <div class="row align-items-center justify-content-center g-4 g-lg-5">

            <div class="col-12 col-lg-6 col-xl-5">
                <div class="qs-form-card p-4 p-md-5">

                    <div class="mb-4">
                        <h1 class="h3 fw-bold text-dark mb-1">
                            Administrator Sign In
                        </h1>

                        <p class="text-muted small mb-0">
                            Enter your credentials to access the Quick Shop store Dashboard panel.
                        </p>
                    </div>

                    <form action="adminLogin" method="post">

                        <div class="mb-3">
                            <label class="form-label" for="adminUsername">
                                Admin UserName
                            </label>

                            <div class="input-group qs-input-group">
                                <span class="input-group-text qs-input-icon">
                                    <i class="bi bi-person-fill"></i>
                                </span>

                                <input
                                        class="form-control"
                                        id="adminUsername"
                                        placeholder="e.g. admin_johndoe"
                                        name="adminName"
                                        required
                                        type="text"/>
                            </div>
                        </div>

                        <div class="mb-3">

                            <div class="d-flex align-items-center justify-content-between mb-1">
                                <label class="form-label mb-0" for="adminPassword">
                                    Password
                                </label>
                            </div>

                            <div class="input-group qs-input-group">

                                <span class="input-group-text qs-input-icon">
                                    <i class="bi bi-lock-fill"></i>
                                </span>

                                <input
                                        class="form-control"
                                        id="adminPassword"
                                        name="password"
                                        placeholder="••••••••"
                                        required
                                        type="password"/>

                                <button
                                        class="btn btn-outline-secondary qs-input-icon border-start-0"
                                        id="togglePasswordVisibility"
                                        style="border-top-right-radius: 0.5rem; border-bottom-right-radius: 0.5rem;"
                                        type="button">

                                    <i class="bi bi-eye" id="passwordToggleIcon"></i>

                                </button>

                            </div>
                        </div>

                        <div class="d-grid mb-4">
                            <button class="btn qs-btn-register" type="submit">
                                Login Here
                            </button>
                        </div>

                        <div class="text-center pt-2 border-top">
                            <p class="small text-muted mb-0">
                                New administrator?
                                <a
                                        class="text-decoration-none fw-semibold"
                                        href="adminRegistration.html"
                                        style="color: #0066c0;">
                                    Register new account
                                </a>
                            </p>
                        </div>

                    </form>
                </div>
            </div>

            <div class="col-12 col-lg-6 col-xl-6 text-center">

                <div class="avatar-circle-wrapper">

                    <div class="floating-badge badge-top-left">
                        <i class="bi bi-shield-check text-success fs-5"></i>
                        <span>Secure Administrator Access</span>
                    </div>

                    <div class="floating-badge badge-bottom-right">
                        <i class="bi bi-cpu text-warning fs-5"></i>
                        <span>Role-Based Authentication</span>
                    </div>

                    <div class="avatar-circle-frame">

                        <img
                                class="img-fluid"
                                alt="Professional 3D illustration of an e-commerce store manager"
                                src="https://lh3.googleusercontent.com/aida-public/AB6AXuBszpKcxrC3UpxrZ5ZuGfdfcgVe41IWEVTYFfX3sjYdizeVB5E4-Z9_37mhS6dj2RpRsieOc0teeMAgCMG1IinOAfkKo3n20LQQdv-qhlPx0ZOpmHSLwtSPuw_mtlxc6fSvrs7Y034v7NN6fCExdNf_IttJoLixe2nrR7v1Jh11boPm6vsd9kuQOaaAdVFjY-uZi19L4zVYAj_anU_6Th4c0StAnk0gdqooUSLMD6K2iBTsdrE7DYs"/>

                    </div>

                </div>

            </div>

        </div>
    </div>
</main>

<footer class="py-3 mt-auto text-center border-top bg-white">
    <div class="container">
        <p class="text-muted small mb-0">
            © 2026 QuickShop.com
        </p>
    </div>
</footer>

<script>
    document.addEventListener('DOMContentLoaded', function () {

        const toggleBtn = document.getElementById('togglePasswordVisibility');
        const passwordInput = document.getElementById('adminPassword');
        const toggleIcon = document.getElementById('passwordToggleIcon');

        if (toggleBtn && passwordInput && toggleIcon) {

            toggleBtn.addEventListener('click', function () {

                const isPassword =
                    passwordInput.getAttribute('type') === 'password';

                passwordInput.setAttribute(
                    'type',
                    isPassword ? 'text' : 'password'
                );

                toggleIcon.classList.toggle('bi-eye');
                toggleIcon.classList.toggle('bi-eye-slash');

            });
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
